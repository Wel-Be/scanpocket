/* ---- 操作 ---- */
async function act(a,b){
  const p=cur?.pages[sel];
  if(a=='t-list'){await leave();only=null;go('list')}
  else if(a=='t-scan'){await leave();cur=newDoc();sel=0;view='edit';draw();$('fc').click()}
  else if(a=='t-set'){await leave();go('set')}
  else if(a=='back'){await leave();go('list')}
  else if(a=='all'){only=null;draw()}
  else if(a=='open'){cur=await get(b.dataset.id);sel=0;pend=null;view='edit';draw()}
  else if(a=='rm'){if(await ask('この書類を削除しますか？<br>端末に保存済みのPDF/JPEGは削除されません。',['キャンセル','削除'])==1){await del(b.dataset.id);toast('削除しました');draw()}}
  else if(a=='rmcur'){if(await ask('この書類を破棄しますか？<br>元画像と編集内容は元に戻せません。端末に保存済みのPDF/JPEGは削除されません。',['キャンセル','破棄'])==1){await del(cur.id);cur=null;go('list')}}
  else if(a=='rmall'){if(await ask('アプリの全データ（書類・画像・サムネイル）を削除しますか？<br>端末に保存済みのPDF/JPEGは削除されません。元に戻せません。',['キャンセル','すべて削除'])==1){await clr();cur=null;toast('全データを削除しました');draw()}}
  else if(a=='cam'){rt=null;$('fc').click()}else if(a=='pick'){rt=null;$('fp').click()}
  else if(a=='adopt')adopt([pend],pc,1);
  else if(a=='retakep'){pend=null;$('fc').click()}else if(a=='cancelp'){pend=null;rt=null;drawEdit()}
  else if(a=='sel'){sel=+b.dataset.i;drawEdit()}
  else if(a=='crop'){const c=await crop(p);if(c){p.corners=c;touch(p)}}
  else if(a=='enh'){p.enh=!p.enh;touch(p)}
  else if(a=='enhall'){cur.pages.forEach(q=>{q.enh=true;q.v++});sv();drawEdit()}
  else if(a=='rot'){p.rot=((p.rot||0)+1)%4;touch(p)}
  else if(a=='left'&&sel>0){[cur.pages[sel-1],cur.pages[sel]]=[cur.pages[sel],cur.pages[sel-1]];sel--;sv();drawEdit()}
  else if(a=='right'&&sel<cur.pages.length-1){[cur.pages[sel+1],cur.pages[sel]]=[cur.pages[sel],cur.pages[sel+1]];sel++;sv();drawEdit()}
  else if(a=='retake'){rt=sel;$('fc').click()}
  else if(a=='export'){await save();view='export';draw()}else if(a=='toedit'){view='edit';draw()}
  else if(a=='run')run();else if(a=='share')share(out.blob,out.name);else if(a=='dl')dl(out.blob,out.name);
  else if(a=='s1'){cur.pages=[];cur.status='exported';cur.updated=Date.now();try{await put(cur);toast('元画像と編集情報を削除しました')}catch(e){toast('保存に失敗しました')}$('res').innerHTML=outHtml().replace(/<p>端末.*<\/p><div class="row"><button data-a="s1".*?<\/div><p class="sub">「保存.*?<\/p>/,'<p>書き出し済みにしました。</p>')}
  else if(a=='s2'||a=='s3'){cur.status='draft';await save();toast(a=='s2'?'元画像を保持しました。再度書き出せます':'元画像を保持しました。あとで確認できます')}
  else if(a=='bk')backup();else if(a=='rs')$('fr').click();
  else if(a=='ka'||a=='kd'||a=='ke')document.querySelectorAll('.rk').forEach(c=>c.checked=a=='ka'||(a=='kd')==(c.dataset.s=='draft'))
  else if(a=='doRs')doRestore()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b)});
app.addEventListener('input',e=>{const i=e.target.id;
  if(i=='nm'){cur.name=e.target.value;sv()}else if(i=='ct'){cur.cat=e.target.value.trim()||'未分類';sv()}
  else if(i=='q'){F.q=e.target.value;refreshList()}});
app.addEventListener('change',e=>{const i=e.target.id;
  if(i=='ar'){cur.ar=e.target.value;cur.pages.forEach(q=>q.v++);sv();drawEdit()}else if(i=='dm'){cur.mode=e.target.value;sv();drawEdit()}else if(i=='pm'){cur.pages[sel].mode=e.target.value||null;touch(cur.pages[sel])}
  else if(i=='fcat'){F.cat=e.target.value;refreshList()}else if(i=='fs'){F.sort=e.target.value;refreshList()}else if(i=='ff'){F.from=e.target.value;refreshList()}else if(i=='ft'){F.to=e.target.value;refreshList()}});
$('fc').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f){pend=f;pc=null;drawEdit();const c=await auto(f);if(pend===f){pc=c;if(!c)toast('輪郭を検出できませんでした。採用後に「台形補正」で調整できます');drawEdit()}}};
$('fp').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;const bl=[];for(const f of fs){if(f.type=='application/pdf'||/\.pdf$/i.test(f.name))bl.push(...await pdfBlobs(f));else bl.push(f)}if(bl.length)adopt(bl)};
$('fr').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readBk(f)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
/* ---- 起動 ---- */
(async()=>{go('list');
  if(!localStorage.getItem('sp_seen')){await ask('<b>ScanPocketへようこそ</b><br>書類を撮影して補正し、PDF/JPEGで書き出せます。画像は端末のブラウザ内だけに保存され、外部へ送信されません。ブラウザデータを消去すると下書きも消えるので、書き出したファイルは端末に保存してください。',['はじめる']);localStorage.setItem('sp_seen',1)}})();
let upd=0;if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const w=r.installing;w.onstatechange=async()=>{if(w.state=='installed'&&navigator.serviceWorker.controller&&await ask('新しいバージョンがあります。下書きは保持されます。更新しますか？',['あとで','更新'])==1){await save();upd=1;w.postMessage('skip')}}}}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(upd)location.reload()})}
</script>
<script data-goatcounter="https://wel-be.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
